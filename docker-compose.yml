# Runs beside the Team Chess stack: its Caddy container terminates TLS and proxies GAMMON_DOMAIN to this service.
services:
  gammon:
    build: .
    container_name: teamgammon-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=1
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - gammon_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ping | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - web

networks:
  web:
    external: true
    name: teamchess_web

volumes:
  gammon_data:
